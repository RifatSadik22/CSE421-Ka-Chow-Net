hostname FVC
no ip domain-lookup

interface GigabitEthernet0/0
 ip address 11.10.3.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/1
 ip address 11.10.6.68 255.255.255.248
 no shutdown
interface Serial0/1/0
 ip address 11.10.6.86 255.255.255.252
 no shutdown

interface Serial0/1/1
 ip address 11.10.6.89 255.255.255.252
 clock rate 64000
 no shutdown

ip route 11.10.0.0 255.255.254.0 Serial0/1/0
ip route 11.10.0.0 255.255.254.0 11.10.6.66 5
ip route 11.10.2.0 255.255.255.0 GigabitEthernet0/1
ip route 11.10.4.0 255.255.255.0 GigabitEthernet0/1
ip route 11.10.5.0 255.255.255.128 Serial0/1/0
ip route 11.10.5.128 255.255.255.128 GigabitEthernet0/1
ip route 11.10.6.0 255.255.255.192 Serial0/1/1
