hostname SS
no ip domain-lookup

interface GigabitEthernet0/0
 ip address 11.10.0.1 255.255.254.0
 no shutdown

interface GigabitEthernet0/1
 ip address 11.10.6.65 255.255.255.248
 no shutdown

interface Serial0/0/0
 ip address 11.10.6.73 255.255.255.252
 clock rate 64000
 no shutdown

interface Serial0/0/1
 ip address 11.10.6.81 255.255.255.252
 clock rate 64000
 no shutdown

interface Serial0/1/0
 ip address 11.10.6.85 255.255.255.252
 clock rate 64000
 no shutdown

ip dhcp excluded-address 11.10.0.1 11.10.0.10
ip dhcp excluded-address 11.10.2.1 11.10.2.10
ip dhcp excluded-address 11.10.5.1 11.10.5.10

ip dhcp pool SS-LAN
 network 11.10.0.0 255.255.254.0
 default-router 11.10.0.1
 dns-server 11.10.0.2

ip dhcp pool DC-LAN
 network 11.10.2.0 255.255.255.0
 default-router 11.10.2.1
 dns-server 11.10.0.2

ip dhcp pool RBA-LAN
 network 11.10.5.0 255.255.255.128
 default-router 11.10.5.1
 dns-server 11.10.0.2

ip route 11.10.3.0 255.255.255.0 11.10.6.86
ip route 11.10.4.0 255.255.255.0 11.10.6.66
ip route 11.10.5.128 255.255.255.128 11.10.6.69
ip route 11.10.6.0 255.255.255.192 11.10.6.86
ip route 11.10.6.88 255.255.255.252 11.10.6.86

router rip
 version 2
 no auto-summary
 network 11.0.0.0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 passive-interface Serial0/1/0
 redistribute static metric 1
