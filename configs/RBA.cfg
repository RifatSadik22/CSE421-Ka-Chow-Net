hostname RBA
no ip domain-lookup

interface GigabitEthernet0/0
 ip address 11.10.5.1 255.255.255.128
 ip helper-address 11.10.6.73
 no shutdown

interface Serial0/1/0
 ip address 11.10.6.74 255.255.255.252
 no shutdown

interface Serial0/1/1
 ip address 11.10.6.77 255.255.255.252
 clock rate 64000
 no shutdown

router rip
 version 2
 no auto-summary
 network 11.0.0.0
 passive-interface GigabitEthernet0/0
