hostname DC
no ip domain-lookup

interface GigabitEthernet0/0
 ip address 11.10.2.1 255.255.255.0
 ip helper-address 11.10.6.81
 no shutdown

interface GigabitEthernet0/1
 ip address 11.10.6.67 255.255.255.248
 no shutdown

interface Serial0/1/0
 ip address 11.10.6.78 255.255.255.252
 no shutdown

interface Serial0/1/1
 ip address 11.10.6.82 255.255.255.252
 no shutdown

router rip
 version 2
 no auto-summary
 network 11.0.0.0
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
